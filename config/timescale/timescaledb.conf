# =============================================================================
# SIH26145 TimescaleDB / PostgreSQL 16 Configuration
# Optimized for high-throughput time-series telemetry ingestion & analytical queries
# =============================================================================

# Connectivity
listen_addresses = '*'
port = 5432
max_connections = 100

# TimescaleDB Extension Preload
shared_preload_libraries = 'timescaledb'
timescaledb.max_background_workers = 8

# Memory Configuration (Tuned for development/test and line-rate ingest)
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 16MB
maintenance_work_mem = 64MB

# Worker Processes & Parallelism
max_worker_processes = 16
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# Write-Ahead Log (WAL) & Checkpoints
wal_level = replica
wal_buffers = 16MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
max_wal_size = 2GB
min_wal_size = 512MB

# Query Planner & Storage Optimization
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Logging
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
