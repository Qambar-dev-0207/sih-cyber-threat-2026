# =============================================================================
# SIH26145 Redis 7.x Configuration
# High-Speed In-Memory Cache & Sliding-Window Complex Event Processing (CEP) Buffer
# =============================================================================

# Network
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 2048
timeout 0
tcp-keepalive 300

# Memory Management & Eviction
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence Disabled for Maximum Ingest Throughput (Line-Rate CEP state buffer)
save ""
appendonly no

# Performance & Concurrency Tuning
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Logging
loglevel notice
